name: Build game for Arvan Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production game
        run: npm run build

      - name: Publish static files to the Arvan origin branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: arvan-static
          force_orphan: true
          commit_message: "deploy: publish static game build"

      - name: Package static build for upload
        run: |
          cd dist
          zip -r ../bazi-arvan-dist.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazi-arvan-dist
          path: bazi-arvan-dist.zip
          if-no-files-found: error
          retention-days: 7
